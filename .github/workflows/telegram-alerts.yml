name: Telegram wallet alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: telegram-alert-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert checks
        env:
          APP_URL: ${{ secrets.SOLCURITY_APP_URL }}
          CRON_SECRET: ${{ secrets.TELEGRAM_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure SOLCURITY_APP_URL and TELEGRAM_CRON_SECRET repository secrets." >&2
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "SOLCURITY_APP_URL must use HTTPS." >&2; exit 1 ;;
          esac
          curl --silent --show-error --fail --max-time 120 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/telegram/alerts/dispatch"
